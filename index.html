<head>
<meta charset="utf-8">

<title>MPP RDR 2026</title>

<style>
:root{
  --navy:#28385c;--navy-d:#1b2745;--teal:#82bebf;--yellow:#f9ed37;--white:#fff;
  --bg:var(--navy);--ink:var(--navy);--mute:#5b6784;
  --acc:var(--yellow);--acc2:#2b7a80;--ok:#13805a;--warn:#a15c07;--bad:#c62828;--radius:6px;
  --shadow:4px 4px 0 var(--navy-d);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--white);font:16px/1.4 'Outfit',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom));background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.2px);background-size:16px 16px}
h1,h2,h3{margin:0;text-transform:uppercase;letter-spacing:.5px;font-weight:900}
h2{font-size:22px}h3{font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--navy);background:#fff;border:2px solid var(--navy);border-radius:var(--radius);padding:12px;width:100%}
input:focus,select:focus{outline:3px solid var(--teal);outline-offset:1px}
input[type=checkbox]{accent-color:var(--navy);width:22px;height:22px}
.wrap{max-width:640px;margin:0 auto;padding:16px}

header.top{position:sticky;top:0;z-index:5;background:var(--navy-d);color:var(--white)}
header.top::after{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--teal) 0 33.3%,var(--yellow) 33.3% 66.6%,#fff 66.6%)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px}
.brand{min-width:0;white-space:nowrap}.who{min-width:0}.who .wn{min-width:0;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:420px){.who .pill{display:none}.brand{font-size:13px;gap:6px}.brand svg{width:24px;height:24px}header.top .wrap{padding:10px 12px}}
.brand{font-weight:900;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:10px;font-size:15px}
.brand span{color:var(--yellow)}
.brand .logo{height:30px;width:auto}
.who{font-size:13px;color:#c3cde4;display:flex;gap:8px;align-items:center}
header.top .btn.sec{background:transparent;color:#fff;border:2px solid #fff;box-shadow:none}

.btn{background:var(--yellow);color:var(--navy);border:2px solid var(--navy-d);border-radius:var(--radius);padding:13px 16px;font-weight:800;width:100%;text-transform:uppercase;letter-spacing:.6px;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--navy-d)}
.btn.sec{background:#fff;color:var(--navy)}
.btn.sm{width:auto;padding:7px 11px;font-size:13px;box-shadow:2px 2px 0 var(--navy-d)}
.btn.danger{background:#fbd0cc;color:#8a1a12}
.btn:disabled{opacity:.5;cursor:not-allowed}

.card{background:#fff;color:var(--navy);border:0;border-radius:var(--radius);padding:14px;margin:14px 0;box-shadow:var(--shadow)}
.card.dark{background:var(--teal);color:var(--navy)}
.card.dark .count{color:var(--navy)}
.card.dark .mute{color:#2a4a62}
.row{display:flex;gap:10px;align-items:center}
.sp{justify-content:space-between}
.mute{color:var(--mute);font-size:14px}
.hero .mute,.foot,main>p.mute{color:#c3cde4}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;background:#fff;color:var(--navy);border:2px solid var(--navy);text-transform:uppercase;letter-spacing:.4px}
.pill.ok{background:#c9f0dd;color:#0b5a3e;border-color:#0b5a3e}.pill.warn{background:#fff6b3;color:#6b5200;border-color:#6b5200}.pill.bad{background:#fbd0cc;color:#8a1a12;border-color:#8a1a12}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--navy-d);border-top:4px solid var(--yellow);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:9px 4px 8px;color:#9fb0d4;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button .ic{font-size:22px;line-height:1.1}
nav.tabs button.on{color:var(--yellow)}
nav.tabs button.on .ic{color:var(--teal)}

.slot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#eef6f6;border:2px dashed var(--navy);border-radius:var(--radius);padding:10px 12px;margin-top:10px;color:var(--navy)}
.slot.filled{border-style:solid;background:#fff}
.slot .n{flex:0 0 32px;height:32px;border-radius:50%;background:var(--navy);color:var(--yellow);display:grid;place-items:center;font-weight:900}
.slot:nth-of-type(1) .n{background:var(--yellow);color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.slot .t{flex:1;min-width:0}
.slot .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .t small{color:var(--mute)}

.sheet-bg{position:fixed;inset:0;background:rgba(27,39,69,.8);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;color:var(--navy);width:100%;max-width:640px;margin:0 auto;border-top:5px solid var(--yellow);border-radius:18px 18px 0 0;max-height:85vh;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet .list{overflow:auto;margin-top:10px}
.opt{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(40,56,92,.15);padding:12px 4px;font-weight:700;color:var(--navy)}
.opt small{display:block;color:var(--mute);font-weight:400}
.opt[disabled]{opacity:.35}

.lb{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--radius);background:#fff;color:var(--navy);margin-top:10px;width:100%;border:0;box-shadow:3px 3px 0 var(--navy-d);text-align:left}
.lb.me{background:var(--yellow)}
.lb .r{flex:0 0 34px;font-weight:900;font-size:19px;text-align:center}
.lb .nm{flex:1;min-width:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .pts{font-weight:900;font-size:20px}
.lb .pts small{font-size:11px;color:var(--mute);font-weight:700;text-transform:uppercase}
.mv{font-size:12px;font-weight:900;width:34px;text-align:center}
.mv.up{color:var(--ok)}.mv.down{color:var(--bad)}.mv.eq{color:var(--mute)}
.det{padding:10px 14px;font-size:14px}
.det .cl{margin:10px 0 2px;color:var(--navy);font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:.5px;border-bottom:3px solid var(--teal);padding-bottom:2px}
.det .ln{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-weight:600}
.s-exact{color:var(--ok)}.s-top{color:var(--warn)}.s-miss{color:var(--bad)}.s-wait{color:var(--mute)}

.seg{display:flex;gap:8px;overflow:auto;padding:4px 4px 8px}
.seg button{flex:0 0 auto;background:transparent;border:2px solid #fff;border-radius:99px;padding:7px 15px;color:#fff;font-weight:800;text-transform:uppercase;font-size:13px}
.seg button.on{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
.rk{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:2px solid rgba(40,56,92,.12)}
.rk:last-of-type{border-bottom:0}
.rk .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--navy);color:var(--yellow);display:grid;place-items:center;font-weight:900}
.rk:nth-of-type(1) .n{background:var(--yellow);color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.field{margin:10px 0}
.field label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy-d);color:#fff;border:2px solid var(--yellow);padding:10px 16px;border-radius:var(--radius);z-index:30;max-width:90vw;font-weight:700}
.toast.err{border-color:#ff8a80;color:#ffb4ac}

.hero{padding:6px 0 4px}
.hero .art{display:block;width:100%;height:auto;border-radius:var(--radius);box-shadow:var(--shadow)}
.hero .logo{display:block;max-height:64px;width:auto;margin:14px auto 0}
.hero h1{font-size:46px;line-height:.95;margin-top:18px;letter-spacing:-.5px;color:#fff}
.hero h1 span{display:inline-block;background:var(--yellow);color:var(--navy);padding:2px 10px;margin-top:6px;transform:rotate(-1.5deg)}
.hero p{margin:14px 0 0}
.tabsw{display:flex;margin:18px 0 6px;border:2px solid #fff;border-radius:var(--radius);overflow:hidden}
.tabsw button{flex:1;padding:11px;background:transparent;border:0;color:#fff;font-weight:800;text-transform:uppercase;font-size:13px;letter-spacing:.5px}
.tabsw button+button{border-left:2px solid #fff}
.tabsw button.on{background:var(--yellow);color:var(--navy)}
.count{font-variant-numeric:tabular-nums;font-weight:900;color:var(--navy);font-size:24px}
.hidden{display:none!important}
.u{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:2px solid rgba(40,56,92,.12)}
.foot{text-align:center;font-size:12px;padding:8px 16px 0}
.msgs{max-height:52vh;min-height:200px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.msg{background:#eef6f6;border-radius:var(--radius);padding:8px 10px;max-width:88%;align-self:flex-start;word-break:break-word}
.msg.mine{background:var(--teal);align-self:flex-end}
.msg.adm{background:var(--yellow);box-shadow:2px 2px 0 var(--navy-d)}
.msg.ann{border:2px dashed var(--navy)}
.msg .mh{font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg .mt{margin-top:2px;white-space:pre-wrap}
.msg .x{background:none;border:0;color:var(--bad);padding:0 2px;font-size:12px}
.send{display:flex;gap:8px;margin-top:10px}
.send .btn{width:auto}
a.btn.wa{display:block;text-align:center;text-decoration:none;margin:10px 0}
details.rules summary{cursor:pointer;font-weight:900;text-transform:uppercase;letter-spacing:.4px}
details.rules p{margin:10px 0 4px}
details.rules ul{margin:4px 0;padding-left:20px}
details.rules li{margin:3px 0}

/* ===== habillage v4 : coques, rails, fond graphique ===== */

html{background:var(--navy-d)}
body{background:#28385c}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' preserveAspectRatio='xMidYMid slice'><rect width='1600' height='900' fill='%2328385c'/><circle cx='1530' cy='40' r='210' fill='%23f9ed37' opacity='.95'/><path d='M-40 900 L260 380 L560 900Z' fill='%2382bebf' opacity='.6'/><path d='M120 900 L330 560 L540 900Z' fill='%231b2745' opacity='.4'/><path d='M0 760 Q200 700 400 760 T800 760 T1200 760 T1600 760 V900 H0Z' fill='%231b2745' opacity='.55'/><path d='M0 820 Q200 770 400 820 T800 820 T1200 820 T1600 820 V900 H0Z' fill='%2382bebf' opacity='.5'/></svg>") center/cover no-repeat}

h2{font-size:24px;line-height:1.05}
.shell{display:block}
.rail{display:none}

.ci{width:54px;height:34px;flex:0 0 54px}
.cls-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:2px solid rgba(40,56,92,.12)}
.cls-row:last-child{border-bottom:0}
.cls-row b{display:block;line-height:1.1}.cls-row small{color:var(--mute)}
.av{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;letter-spacing:.3px;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.av.a0{background:var(--yellow)}.av.a1{background:var(--teal)}.av.a2{background:#fff}.av.a3{background:#c3cde4}
.big{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.route svg{display:block;width:100%;height:auto;border-radius:4px}
.route .dash{stroke-dasharray:6 7;animation:draw 2.4s ease-out both}
@keyframes draw{from{stroke-dashoffset:420;opacity:.2}to{stroke-dashoffset:0;opacity:1}}

.podium{display:flex;align-items:flex-end;gap:8px;margin:6px 0 2px}
.podium .st{flex:1;text-align:center;min-width:0}
.podium .st .nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.podium .st .pt{font-size:12px;color:var(--mute)}
.podium .blk{margin-top:6px;border-radius:4px 4px 0 0;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.podium .st.p1 .blk{height:64px;background:var(--yellow)}

.cardhead{display:flex;align-items:center;gap:12px}
.cardhead h3{flex:1}
.slot .av{width:30px;height:30px;font-size:11px}
.opt{display:flex!important;gap:10px;align-items:center}
.opt .av{width:30px;height:30px;font-size:11px}
.opt .tx{flex:1;min-width:0}
.authgrid{max-width:1100px;margin:0 auto;padding:16px}
@media(min-width:900px){
  .authgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;min-height:100vh;padding:32px}

<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* ============ CONFIG ============ */
// Colle ici l'URL de ton déploiement Apps Script (se termine par /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbw1rQ5wbQz9k4HQsv9dyx_eSI11GKYlqe7s9-airuDbuJpNwhITE9u5jZkRcAHIJ3-Y/exec';
/* ================================== */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const S = {
  token: null, me: null, cfg: null, picks: {}, draft: {}, board: null,
  tab: 'picks', detail: {}, bkey: '', raceClass: null, authMode: 'login', adm: null, open: null, offset: 0, busy: false
};

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast' + (err ? ' err' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('hidden'), 3200);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
const WRITES = ['register', 'savePicks', 'adminSettings', 'adminSetRanking', 'adminResetPin', 'adminDeleteUser', 'adminRefresh', 'adminLeagueSave', 'adminLeagueDelete', 'adminMoveUser', 'chatSend', 'chatDelete', 'forgot', 'adminDismissRequest', 'changePassword'];

async function api(action, data) {
  if (!API_URL || API_URL.indexOf('COLLE_ICI') === 0) throw new Error('API_URL non configurée dans index.html');
  const isWrite = WRITES.indexOf(action) !== -1;
  const body = JSON.stringify(Object.assign({ action: action, token: S.token }, data || {}));
  for (let i = 0; i < 4; i++) {
    try {
      const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: body });
      const j = await r.json();
      if (!j.ok) {
        // "BUSY" = le serveur n'a RIEN exécuté (file d'attente pleine) : on peut réessayer sans risque, même en écriture
        if (/BUSY/.test(j.error || '') && i < 3) { await sleep(700 * (i + 1) + Math.random() * 700); continue; }
        throw new Error((j.error || 'Erreur').replace(/^BUSY : /, ''));
      }
      return j.data;
    } catch (e) {
      // coupure réseau / page de surcharge Google : on réessaie les lectures, pas les écritures (évite les doublons)
      const transient = e.name === 'TypeError' || e.name === 'SyntaxError';
      if (transient && !isWrite && i < 3) { await sleep(800 * (i + 1) + Math.random() * 800); continue; }
      if (transient) throw new Error('Le serveur est très sollicité en ce moment, réessaie dans quelques secondes.');
      throw e;
    }
  }
}

async function guard(fn) {
  try { return await fn(); }
  catch (e) {
    if (/Session expirée/.test(e.message)) { logout(true); return; }
    toast(e.message, true);
  }
}

/* ============ TEMPS ============ */
function now() { return Date.now() + S.offset; }
function lockMs() { return new Date(S.cfg.lockISO).getTime(); }
function isLocked() { return now() >= lockMs(); }
function fmtCount(ms) {
  if (ms <= 0) return '0s';
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (d ? d + 'j ' : '') + (d || h ? h + 'h ' : '') + m + 'min ' + x + 's';
}
function fmtDate(iso) {
  return new Date(iso).toLocaleString('fr-FR', { timeZone: 'Europe/Paris', weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
}
function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('fr-FR', { timeZone: 'Europe/Paris', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}

/* ============ AUTH ============ */
function logout(silent) {
  S.token = null; S.me = null; lsSet('prono_token', null);
  S.board = null; S.adm = null; S.detail = {}; S.scope = undefined; S.chatLeague = null; S.open = null; S.tab = 'picks';

const BUILD = '2026-10-28-a';
/* Auto-mise à jour : si une version plus récente du site est en ligne, on recharge une fois (évite l'ancienne version en cache du téléphone) */
async function checkUpdate() {
  try {
    if (sessionStorage.getItem('prono_reloaded') === BUILD) return;
    const t = await (await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' })).text();
    const m = t.match(/const BUILD = '([^']+)'/);
    if (m && m[1] !== BUILD) { sessionStorage.setItem('prono_reloaded', m[1]); location.replace(location.pathname + '?v=' + encodeURIComponent(m[1])); }

}

    S.cfg = await pCfg;
    S.offset = new Date(S.cfg.serverNow).getTime() - Date.now();

    if (S.token) {

      : e.message;
  }
  render();
  setInterval(tick, 1000);
  (function chatLoop() {   // chat : toutes les 10-16 s, seulement si l'onglet Chat est affiché et la page visible
    setTimeout(() => { if (S.me && !document.hidden && S.tab === 'chat') pollChat(); chatLoop(); }, 10000 + Math.random() * 6000);
  })();
  (function loop() {   // rafraîchissement doux : 45-75 s, seulement si la page est visible (évite que tout le monde tape en même temps)
    setTimeout(() => { if (S.me && !document.hidden && (S.tab === 'board' || S.tab === 'race')) refreshBoard(true); loop(); }, 45000 + Math.random() * 30000);
  })();
}

function tick() {
  const rc = $('#cdr');
  if (rc && S.cfg) { const lf = lockMs() - now(); rc.textContent = lf > 0 ? fmtCount(lf) : 'Verrouillé'; }
  const el = $('#count');
  if (el && S.cfg) {
    const left = lockMs() - now();
    el.textContent = left > 0 ? fmtCount(left) : 'Verrouillé';
    if (left <= 0 && S._wasOpen) { S._wasOpen = false; render(); }
  }
}

function uiAsk(o) {
  return new Promise(resolve => {
    const bg = document.createElement('div');
    bg.className = 'sheet-bg modal';
    const fields = (o.fields || []).map((f, i) => '<div class="field"><label for="dlg' + i + '">' + esc(f.label) + '</label><input id="dlg' + i + '" type="' + (f.type || 'text') + '" value="' + esc(f.value || '') + '" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"></div>').join('');
    bg.innerHTML = '<div class="sheet dlg" role="dialog" aria-modal="true"><h3>' + esc(o.title) + '</h3>' + (o.text ? '<p class="mute" style="margin:8px 0">' + esc(o.text) + '</p>' : '') + fields +
      '<div class="dlgbtns">' + (o.cancel === false ? '' : '<button class="btn sec" data-x="0">Annuler</button>') + '<button class="btn' + (o.danger ? ' danger' : '') + '" data-x="1">' + esc(o.ok || 'OK') + '</button></div></div>';
    document.body.appendChild(bg);
    const done = v => { document.removeEventListener('keydown', onKey); bg.remove(); resolve(v); };
    const val = () => (o.fields && o.fields.length) ? o.fields.map((f, i) => bg.querySelector('#dlg' + i).value) : true;
    const onKey = e => { if (e.key === 'Escape' && o.cancel !== false) done(null); else if (e.key === 'Enter') { e.preventDefault(); done(val()); } };
    document.addEventListener('keydown', onKey);
    bg.querySelectorAll('[data-x]').forEach(b => b.onclick = () => done(b.dataset.x === '1' ? val() : null));
    const first = bg.querySelector('input'); if (first) setTimeout(() => first.focus(), 50);
  });
}

function leftRail() {
  const cl = (S.cfg && S.cfg.classes) || [];
  const lbl = { ULTIM: 'Les géants, 32 m', OCEAN50: 'Trimarans de 50 pieds', IMOCA: 'Monocoques à foils', CLASS40: 'Monocoques de 40 pieds' };
  return '<div class="tile route" style="padding:0;overflow:hidden">' + routeSvg() + '</div>' +
    '<div class="tile"><h4>Les 4 classes</h4>' + cl.map(c => '<div class="cls-row">' + boatIcon(c.id) + '<div><b>' + esc(c.label) + '</b><small>' + (lbl[c.id] || '') + ' · top ' + c.n + '</small></div></div>').join('') + '</div>';
}
function rightRail() {
  const b = S.board, sc = S.cfg ? S.cfg.scoring : null;
  let pod = '';
  const list = b && b.board ? b.board.filter(x => x.total > 0).slice(0, 3) : [];
  if (list.length) {
    const ord = [list[1], list[0], list[2]].filter(Boolean);
    pod = '<div class="tile"><h4>Podium' + (b.leagueName ? ' · ' + esc(b.leagueName) : '') + '</h4><div class="podium">' + ord.map(x =>
      '<div class="st p' + x.rank + '">' + avatar(x.pseudo) + '<div class="nm">' + esc(x.pseudo) + '</div><div class="pt">' + x.total + ' pts</div><div class="blk">' + x.rank + '</div></div>').join('') + '</div></div>';
  }
  return '<div class="tile n"><div style="font-size:13px;opacity:.8">' + (isLocked() ? 'La course est lancée' : 'Départ dans') + '</div><div class="big" id="cdr">…</div></div>' +
    pod +
    '<div class="tile y"><h4>À gagner</h4><div style="display:flex;gap:10px;align-items:center"><span style="font-size:34px">🍹</span><b>Un ti\' punch pour le grand gagnant !</b></div></div>' +
    (sc ? '<div class="tile"><h4>Les points</h4><div class="cls-row"><b class="big" style="font-size:22px;width:44px">+' + sc.exact + '</b><span>bon skipper, bonne place</span></div><div class="cls-row"><b class="big" style="font-size:22px;width:44px">+' + sc.inTop + '</b><span>dans le top, mal placé</span></div><div class="cls-row"><b class="big" style="font-size:22px;width:44px">+' + sc.winner + '</b><span>vainqueur trouvé</span></div><div class="cls-row"><b class="big" style="font-size:22px;width:44px">+' + sc.perfect + '</b><span>top parfait</span></div></div>' : '');
}
function drawRails() {
  const l = $('#raill'), r = $('#railr');
  if (l && S.cfg) l.innerHTML = leftRail();
  if (r && S.cfg) r.innerHTML = rightRail();
  tick();
}

/* ============ RENDER ============ */
function render() {
  const app = $('#app');
  if (!S.cfg) {
    app.innerHTML = S.err
      ? '<div class="wrap hero"><h1>Oups<br><span>erreur</span></h1><div class="card" style="margin-top:20px"><p style="margin:0 0 12px"><b>' + esc(S.err) + '</b></p><button class="btn" id="retry">Réessayer</button></div></div>'
      : '<div class="wrap hero"><p class="mute" style="text-align:center;padding:60px 0">Chargement…</p></div>';
    const r = $('#retry'); if (r) r.onclick = () => { S.err = null; render(); boot(); };
    return;
  }
  if (!S.me) { app.innerHTML = authView(); bindAuth(); return; }
  const isAdm = S.me.role === 'admin';
  app.innerHTML =
    '<header class="top"><div class="wrap"><div class="brand"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="#f9ed37"/><path d="M15 29 L29 29 L22 15Z" fill="#82bebf"/><rect x="1" y="17" width="12" height="12" fill="#fff"/></svg><img class="logo" src="logo.png" alt="" onerror="this.remove()">MPP <span>RDR 2026</span></div>' +
    '<div class="who">' + '<span class="wn">' + esc(S.me.pseudo) + '</span>' + (isAdm ? ' <span class="pill">admin</span>' : (S.me.league ? ' <span class="pill">' + esc(S.me.league.name) + '</span>' : '')) + ' <button class="btn sm sec" id="out">Quitter</button></div></div></header>' +
    '<div class="shell"><aside class="rail" id="raill"></aside><main class="wrap" id="main"></main><aside class="rail" id="railr"></aside></div><p class="foot">Jeu de pronos entre amis · application non officielle<br><a href="#" id="chpw" style="color:#c3cde4">Changer mon mot de passe</a></p>' +
    '<nav class="tabs"><div class="in">' +
    (isAdm ? tabBtn('admin', '■', 'Admin' + (S.adm && S.adm.requests && S.adm.requests.length ? ' 🔑' + S.adm.requests.length : '')) + tabBtn('picks', '◎', 'Test') : tabBtn('picks', '◎', 'Pronos')) + tabBtn('board', '▲', 'Joueurs') + tabBtn('chat', '✉', 'Chat') + tabBtn('race', '≋', 'Course') +
    '</div></nav>';
  $('#out').onclick = () => logout();
  drawRails();
  if (!S.board && !S._railBoard) { S._railBoard = true; api('board', { scope: S.scope }).then(b => { if (!S.board) S.board = b; drawRails(); }).catch(() => {}); }
  $('#chpw').onclick = async e => {
    e.preventDefault();
    const v = await uiAsk({ title: 'Changer mon mot de passe', fields: [{ label: 'Mot de passe actuel', type: 'password' }, { label: 'Nouveau mot de passe (6 caractères minimum, sans espace)', type: 'password' }], ok: 'Changer' });
    if (!v) return;
    const old = v[0].trim(), nw = v[1].trim(); if (!old || !nw) return;
    guard(async () => { const r = await api('changePassword', { pin: old, newPin: nw }); S.token = r.token; lsSet('prono_token', r.token); toast('Mot de passe changé ✔'); });
  };
  document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; if (S.tab === 'admin') S.adm = null; render(); });
  if (S.tab === 'picks') viewPicks();
  else if (S.tab === 'chat') viewChat();
  else if (S.tab === 'board') viewBoard();
  else if (S.tab === 'race') viewRace();
  else if (S.tab === 'admin' && isAdm) viewAdmin();
  window.scrollTo(0, 0);
}

    (reg ? '<div class="field"><label>Numéro de téléphone</label><input id="a_phone" type="tel" autocomplete="tel" maxlength="20" placeholder="06 12 34 56 78"><div class="mute" style="margin-top:4px">Visible uniquement par l\'admin, pour te dépanner si tu perds ton mot de passe.</div></div>' : '') +
    (reg ? '<div class="field"><label>Code de ta ligue (donné par l\'admin)</label><input id="a_code" autocapitalize="characters"></div>' : '') +
    '<button class="btn" id="a_go">' + (reg ? 'Rejoindre la ligue' : 'Se connecter') + '</button>' +
    (reg ? '' : '<p style="text-align:center;margin:12px 0 0"><a href="#" id="a_forgot" style="color:var(--navy);font-weight:700">Mot de passe oublié ?</a></p>') + '</div></div></div>';
}

function bindAuth() {
  document.querySelectorAll('.tabsw button').forEach(b => b.onclick = () => { S.authMode = b.dataset.m; render(); });
  const go = () => guard(async () => {
    const btn = $('#a_go'); btn.disabled = true;
    try {
      const body = { pseudo: $('#a_pseudo').value, pin: $('#a_pin').value.trim() };   // trim : évite l'espace ajouté par l'autocorrection du clavier
      if (S.authMode === 'register') { body.code = $('#a_code').value; body.phone = $('#a_phone').value; }
      const r = await api(S.authMode, body);
      S.token = r.token; S.me = r.me; lsSet('prono_token', r.token); if (S.me.role === 'admin') S.tab = 'admin';
      const m = await api('me'); S.picks = m.picks; S.draft = JSON.parse(JSON.stringify(m.picks));
      S.tab = S.me.role === 'admin' ? 'admin' : 'picks'; render();
    } finally { const b = $('#a_go'); if (b) b.disabled = false; }
  });
  $('#a_go').onclick = go;
  const fg = $('#a_forgot');
  if (fg) fg.onclick = e => {
    e.preventDefault();
    const pseudo = $('#a_pseudo').value.trim();
    if (!pseudo) { toast('Entre d\'abord ton pseudo ci-dessus', true); return; }
    guard(async () => { await api('forgot', { pseudo: pseudo }); await uiAlert('Demande envoyée', 'L\'admin va te contacter par téléphone avec un nouveau mot de passe, que tu pourras changer ensuite dans l\'application.'); });
  };
  document.querySelectorAll('.card input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') go(); });
}

/* ============ MES PRONOS ============ */
function skipperInfo(cid, name) { return (S.cfg.skippers[cid] || []).find(s => s.name === name); }

function rulesCard(open) {
  const sc = S.cfg.scoring, mx = S.cfg.classes.reduce((a, c) => a + c.n * sc.exact + sc.winner + (sc.perfect3 || 0) + sc.perfect, 0);
  const per = S.cfg.classes[0].n * sc.exact + sc.winner + (sc.perfect3 || 0) + sc.perfect;
  return '<details class="card rules"' + (open ? ' open' : '') + '><summary>📖 Règles et comment gagner</summary>' +
    '<p><b>Le principe :</b> pour chaque classe (' + S.cfg.classes.map(c => esc(c.label)).join(', ') + '), tu prédis le <b>top ' + S.cfg.classes[0].n + '</b> de la Route du Rhum, dans l\'ordre. Tu peux modifier tes pronos jusqu\'au départ (' + esc(fmtDate(S.cfg.lockISO)) + '), ensuite tout est verrouillé et chacun voit les pronos des autres.</p>' +
    '<p><b>Les points, classe par classe :</b></p><ul>' +
    '<li><b>+' + sc.exact + ' pts</b> : ton skipper finit exactement à la place que tu avais choisie.</li>' +
    '<li><b>+' + sc.inTop + ' pts</b> : ton skipper est bien dans le top ' + S.cfg.classes[0].n + ', mais pas à la bonne place.</li>' +
    '<li><b>+' + sc.winner + ' pts</b> de bonus si tu avais mis le bon vainqueur en 1re place.</li>' +
    '<li><b>+' + (sc.perfect3 || 0) + ' pts</b> de bonus si ton top 3 est parfait (les 3 premiers à la bonne place).</li>' +
    '<li><b>+' + sc.perfect + ' pts</b> de bonus en plus si ton top est parfait (tous les skippers à la bonne place).</li></ul>' +
    '<p>Maximum : ' + per + ' pts par classe, ' + mx + ' pts au total.</p>' +
    '<p><b>Pendant la course :</b> le classement officiel est mis à jour régulièrement, donc les points et les flèches ▲▼ bougent jusqu\'à l\'arrivée. En cas d\'égalité, celui qui a le plus de skippers à la bonne place passe devant.</p>' +
    '<p><b>Pour gagner :</b></p><ul>' +
    '<li>Le vainqueur de chaque classe est le prono le plus rentable : ' + (sc.exact + sc.winner) + ' pts d\'un coup.</li>' +
    '<li>Un skipper dans le top, même mal placé, rapporte quand même ' + sc.inTop + ' pts : mieux vaut miser sur des skippers solides que sur un pari risqué.</li>' +
    '<li>Les 4 classes comptent autant : ne laisse aucune classe vide, un top incomplet ne s\'enregistre pas.</li></ul>' +
    '<p style="margin-top:14px;padding:10px;background:var(--yellow);border-radius:var(--radius);text-align:center"><b>🍹 Le grand gagnant se verra offrir un ti\' punch !</b><br><span class="mute" style="color:var(--navy)">Valable à consommer avec modération, et à partager avec les perdants (surtout ceux qui avaient misé sur le mauvais Ultim).</span></p></details>';
}

function viewPicks() {
  const adm = S.me.role === 'admin';
  const locked = isLocked() && !adm;   // l'admin peut toujours tester l'écran de pronos
  S._wasOpen = !locked && !adm;   // l'admin ne déclenche pas le re-rendu automatique au verrouillage
  let h = adm ? '<div class="card" style="background:var(--yellow)"><b>Mode test (vue joueur)</b><div class="mute" style="color:var(--navy)">Tu vois l\'écran tel que le voit un joueur. Rien n\'est enregistré et ton compte ne joue pas.</div></div>' : '';
  h += '<div class="card dark"><div class="row sp"><div><div class="mute">' + (locked ? 'Pronos verrouillés' : 'Verrouillage dans') + '</div>' +
    '<div class="count" id="count">…</div></div><span class="pill ' + (locked ? 'bad' : 'ok') + '">' + (locked ? 'Course lancée' : 'Ouvert') + '</span></div>' +
    '<div class="mute" style="margin-top:6px">Départ : ' + esc(fmtDate(S.cfg.lockISO)) + '</div></div>';
  h += rulesCard(!Object.keys(S.picks || {}).length);
  S.cfg.classes.forEach(c => {
    const d = S.draft[c.id] || [];
    const filled = d.filter(Boolean).length;
    h += '<div class="card"><div class="cardhead">' + boatIcon(c.id, '#eef6f6') + '<h3>' + esc(c.label) + ' <span class="mute">· top ' + c.n + '</span></h3>' +
      '<span class="pill ' + (filled === c.n ? 'ok' : 'warn') + '">' + filled + '/' + c.n + '</span></div>';
    for (let i = 0; i < c.n; i++) {
      const nm = d[i], info = nm ? skipperInfo(c.id, nm) : null;
      h += '<button class="slot ' + (nm ? 'filled' : '') + '" data-c="' + c.id + '" data-i="' + i + '" ' + (locked ? 'disabled' : '') + '>' +
        '<span class="n">' + (i + 1) + '</span>' + (nm ? avatar(nm) : '') + '<span class="t">' + (nm ? '<b>' + esc(nm) + '</b><small>' + esc(info ? info.boat : '') + '</small>' : '<span class="mute">Choisir un skipper…</span>') + '</span>' +
        (nm && !locked ? '<span class="mute">✎</span>' : '') + '</button>';
    }
    h += '</div>';
  });
  if (!locked) h += '<button class="btn" id="save">Enregistrer mes pronos</button><p class="mute" style="text-align:center">Tu peux modifier jusqu\'au départ.</p>';
  $('#main').innerHTML = h;
  tick();
  document.querySelectorAll('.slot').forEach(b => b.onclick = () => openPicker(b.dataset.c, +b.dataset.i));
  const sv = $('#save');
  if (sv) sv.onclick = () => guard(async () => {
    sv.disabled = true;
    try {
      if (S.me.role === 'admin') { toast('Mode test : rien n\'est enregistré'); return; }
      await api('savePicks', { picks: S.draft });
      S.picks = JSON.parse(JSON.stringify(S.draft));
      toast('Pronos enregistrés ✔');
    } finally { sv.disabled = false; }
  });
}

function openPicker(cid, idx) {
  const cl = S.cfg.classes.find(c => c.id === cid);
  const d = S.draft[cid] = S.draft[cid] || [];
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.innerHTML = '<div class="sheet"><div class="row sp"><h3>' + esc(cl.label) + ' · place ' + (idx + 1) + '</h3><button class="btn sm sec" id="x">Fermer</button></div>' +
    '<input id="q" placeholder="Rechercher un skipper ou un bateau…" style="margin-top:10px"><div class="list" id="lst"></div></div>';
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.onclick = e => { if (e.target === bg) close(); };
  $('#x', bg).onclick = close;
  const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const draw = () => {
    const q = norm($('#q', bg).value);
    const used = d.filter((x, i) => x && i !== idx);
    let h = d[idx] ? '<button class="opt" data-clear="1" style="color:var(--bad)">✖ Vider cette place</button>' : '';
    S.cfg.skippers[cid].filter(s => !q || norm(s.name + ' ' + s.boat).indexOf(q) !== -1).forEach(s => {
      h += '<button class="opt" data-n="' + esc(s.name) + '" ' + (used.indexOf(s.name) !== -1 ? 'disabled' : '') + '>' + avatar(s.name) + '<span class="tx">' + esc(s.name) + '<small>' + esc(s.boat) + (used.indexOf(s.name) !== -1 ? ' · déjà choisi' : '') + '</small></span></button>';
    });
    $('#lst', bg).innerHTML = h || '<p class="mute">Aucun résultat.</p>';
    bg.querySelectorAll('.opt').forEach(o => o.onclick = () => {
      if (o.dataset.clear) d[idx] = ''; else d[idx] = o.dataset.n;
      close(); viewPicks();
    });
  };
  $('#q', bg).oninput = draw; draw();
}

/* ============ CLASSEMENT JOUEURS ============ */
async function refreshBoard(quiet) {
  await guard(async () => {
    S.board = await api('board', { scope: S.scope });
    lsSet('prono_board_' + (S.me ? S.me.pseudo : ''), JSON.stringify(S.board));
    const k = JSON.stringify(S.board.updatedAt) + S.board.locked + S.board.scope;
    if (k !== S.bkey) { S.bkey = k; S.detail = {}; }
    if (S.tab === 'board') viewBoard(); else if (S.tab === 'race') viewRace();
  });
}

function viewBoard() {
  if (!S.board) {
    let c = null; try { c = JSON.parse(lsGet('prono_board_' + S.me.pseudo) || 'null'); } catch (e) {}
    if (c && c.board && (S.me.role === 'admin' || c.scope === 'all' || (S.me.league && c.scope === S.me.league.id))) { S.board = c; refreshBoard(true); }
    else { $('#main').innerHTML = '<p class="mute" style="text-align:center;padding:40px">Chargement…</p>'; refreshBoard(); return; }
  }
  const b = S.board;
  let h = '<div class="row sp" style="margin-top:6px"><h2>Classement des joueurs</h2><button class="btn sm sec" id="rf">↻</button></div>';
  if (S.me.role === 'admin' && b.leagues && b.leagues.length) {
    h += '<div class="seg"><button data-sc="all" class="' + (b.scope === 'all' ? 'on' : '') + '">Général</button>' + b.leagues.map(l => '<button data-sc="' + esc(l.id) + '" class="' + (b.scope === l.id ? 'on' : '') + '">' + esc(l.name) + '</button>').join('') + '</div>';
  } else if (b.leaguesCount > 1 && S.me.league) {
    h += '<div class="tabsw"><button data-sc="mine" class="' + (b.scope !== 'all' ? 'on' : '') + '">' + esc(S.me.league.name) + '</button><button data-sc="all" class="' + (b.scope === 'all' ? 'on' : '') + '">Général</button></div>';
  }
  h += rulesCard(false);
  const top3 = b.board.filter(x => x.total > 0).slice(0, 3);
  if (top3.length) h += '<div class="card mobonly"><div class="podium">' + [top3[1], top3[0], top3[2]].filter(Boolean).map(x => '<div class="st p' + x.rank + '">' + avatar(x.pseudo) + '<div class="nm">' + esc(x.pseudo) + '</div><div class="pt">' + x.total + ' pts</div><div class="blk">' + x.rank + '</div></div>').join('') + '</div></div>';
  if (!b.locked) h += '<div class="card mute">Les pronos des autres joueurs seront visibles au départ de la course.</div>';
  const anyRank = Object.keys(b.ranking).some(k => b.ranking[k].length);
  if (b.locked && !anyRank) h += '<div class="card mute">En attente du premier classement officiel…</div>';
  b.board.forEach(x => {
    let mv = '<span class="mv eq">–</span>';
    if (x.prevRank && x.prevRank !== x.rank) mv = x.rank < x.prevRank ? '<span class="mv up">▲' + (x.prevRank - x.rank) + '</span>' : '<span class="mv down">▼' + (x.rank - x.prevRank) + '</span>';
    const medal = x.total > 0 ? (x.rank === 1 ? '🥇' : x.rank === 2 ? '🥈' : x.rank === 3 ? '🥉' : x.rank) : x.rank;
    h += '<button class="lb ' + (x.pseudo === S.me.pseudo ? 'me' : '') + '" data-p="' + esc(x.pseudo) + '"><span class="r">' + medal + '</span>' + mv + avatar(x.pseudo) +
      '<span class="nm">' + esc(x.pseudo) + '</span><span class="pts">' + x.total + ' <small>pts</small></span></button>';
    if (S.open === x.pseudo) {
      const d = S.detail[x.pseudo];
      if (!b.locked) h += '<div class="card mute">Pronos visibles au départ.</div>';
      else if (!d) { h += '<div class="card mute">Chargement…</div>'; loadDetail(x.pseudo); }
      else {
        h += '<div class="card det">';
        S.cfg.classes.forEach(c => {
          const dc = d[c.id];
          h += '<div class="cl">' + esc(c.label) + ' · ' + dc.pts + ' pts</div>';
          dc.detail.forEach((l, i) => {
            h += '<div class="ln"><span class="s-' + l.status + '">' + (i + 1) + '. ' + esc(l.skipper || '—') + '</span><span class="s-' + l.status + '">+' + l.pts + '</span></div>';
          });
        });
        h += '</div>';
      }
    }
  });
  $('#main').innerHTML = h;
  $('#rf').onclick = () => refreshBoard();
  document.querySelectorAll('[data-sc]').forEach(t => t.onclick = () => { S.scope = S.me.role === 'admin' ? t.dataset.sc : (t.dataset.sc === 'all' ? 'all' : undefined); S.open = null; S.board = null; viewBoard(); });
  document.querySelectorAll('.lb').forEach(l => l.onclick = () => { S.open = S.open === l.dataset.p ? null : l.dataset.p; viewBoard(); });
}

async function loadDetail(pseudo) {
  if (S._ld === pseudo) return;
  S._ld = pseudo;
  await guard(async () => {
    const r = await api('detail', { pseudo: pseudo });
    S.detail[pseudo] = r.details || {};
  });
  S._ld = null;
  if (S.tab === 'board' && S.detail[pseudo]) viewBoard();
}

/* ============ COURSE (LIVE) ============ */
function viewRace() {
  if (!S.board) { $('#main').innerHTML = '<p class="mute" style="text-align:center;padding:40px">Chargement…</p>'; refreshBoard(); return; }
  const b = S.board, cl = S.cfg.classes.find(c => c.id === S.raceClass), list = b.ranking[cl.id] || [];
  const mine = S.picks[cl.id] || [];
  let h = '<div class="row sp" style="margin-top:6px"><h2>Classement course</h2><button class="btn sm sec" id="rf">↻</button></div>' +
    '<div class="card route" style="padding:0;overflow:hidden">' + routeSvg() + '</div>' +
    '<div class="seg" style="margin-top:10px">' + S.cfg.classes.map(c => '<button data-c="' + c.id + '" class="' + (c.id === cl.id ? 'on' : '') + '">' + esc(c.label) + '</button>').join('') + '</div>';
  h += '<div class="card"><div class="row sp"><h3>' + esc(cl.label) + ' · top ' + cl.n + '</h3>' +
    (b.finals[cl.id] ? '<span class="pill ok">Final</span>' : '<span class="pill warn">En cours</span>') + '</div>';
  if (!list.length) h += '<p class="mute">Pas encore de classement officiel pour cette classe.</p>';
  list.forEach((s, i) => {
    const info = skipperInfo(cl.id, s), pi = mine.indexOf(s);
    const tag = pi === i ? '<span class="pill ok">ton prono ✔</span>' : pi >= 0 ? '<span class="pill warn">ton #' + (pi + 1) + '</span>' : '';
    h += '<div class="rk"><span class="n">' + (i + 1) + '</span><div style="flex:1;min-width:0"><b>' + esc(s) + '</b><div class="mute">' + esc(info ? info.boat : '') + '</div></div>' + tag + '</div>';
  });
  h += '<p class="mute" style="margin-bottom:0">Dernière mise à jour : ' + esc(fmtTime(b.updatedAt[cl.id])) + '</p></div>';
  $('#main').innerHTML = h;
  $('#rf').onclick = () => refreshBoard();
  document.querySelectorAll('.seg button').forEach(x => x.onclick = () => { S.raceClass = x.dataset.c; viewRace(); });
}

/* ============ CHAT ============ */
function chatLeagueId() { return S.me.role === 'admin' ? (S.chatLeague || '') : ''; }
function chatHtml(msgs) {
  if (!msgs.length) return '<p class="mute" style="text-align:center;padding:24px 0">Aucun message. Lance la discussion !</p>';
  return msgs.map(m => {
    const mine = m.pseudo === S.me.pseudo, ann = m.league === '*';
    const t = new Date(Number(m.id.split('-')[0]) || Date.parse(m.ts));
    const hh = String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
    return '<div class="msg ' + (mine ? 'mine' : '') + (m.role === 'admin' ? ' adm' : '') + (ann ? ' ann' : '') + '"><div class="mh"><b>' + esc(m.pseudo) + '</b>' +
      (m.role === 'admin' ? ' <span class="pill">admin</span>' : '') + (ann ? ' <span class="pill warn">annonce</span>' : '') + ' <span class="mute">' + hh + '</span>' +
      (S.me.role === 'admin' ? ' <button class="x" data-cd="' + esc(m.id) + '" aria-label="Supprimer">✖</button>' : '') + '</div><div class="mt">' + esc(m.text) + '</div></div>';
  }).join('');
}
function drawMsgs(r) {
  const box = $('#msgs'); if (!box) return;
  const key = r.league + '|' + r.messages.length + '|' + (r.messages.length ? r.messages[r.messages.length - 1].id : '');
  if (key === S.chatKey) return;
  S.chatKey = key;
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = chatHtml(r.messages);
  if (near || S._chatFirst) box.scrollTop = box.scrollHeight;
  S._chatFirst = false;
  box.querySelectorAll('[data-cd]').forEach(b => b.onclick = () => guard(async () => {
    if (!(await uiConfirm('Supprimer ce message ?', '', 'Supprimer'))) return;
    await api('chatDelete', { id: b.dataset.cd }); S.chatKey = ''; await pollChat();
  }));
}
async function pollChat() {
  if (S._chatBusy) return;
  S._chatBusy = true;
  try {
    const r = await api('chatGet', { league: chatLeagueId() || undefined });
    if (S.tab === 'chat') drawMsgs(r);
  } catch (e) { /* silencieux : on réessaiera au prochain tour */ }
  S._chatBusy = false;
}
async function viewChat() {
  const adm = S.me.role === 'admin';
  if (adm && !(S.board && S.board.leagues)) { try { S.board = await api('board'); } catch (e) {} }
  const leagues = adm ? ((S.board && S.board.leagues) || []) : [];
  const lg = adm ? leagues.find(l => l.id === S.chatLeague) || leagues[0] : S.me.league;
  if (adm && lg) S.chatLeague = lg.id;
  let h = '<div class="row sp" style="margin-top:6px"><h2>Chat' + (lg ? ' · ' + esc(lg.name) : '') + '</h2></div>';
  if (adm) h += '<div class="seg">' + leagues.map(l => '<button data-cl="' + esc(l.id) + '" class="' + (l.id === S.chatLeague ? 'on' : '') + '">' + esc(l.name) + '</button>').join('') + '</div>';
  h += '<div class="card chat"><div id="msgs" class="msgs"><p class="mute" style="text-align:center;padding:24px 0">Chargement…</p></div>' +
    '<div class="send"><input id="c_in" maxlength="300" placeholder="Ton message…" autocomplete="off"><button class="btn sm" id="c_go">Envoyer</button></div>' +
    (adm ? '<label class="row mute" style="margin-top:8px"><input type="checkbox" id="c_all" style="width:auto"> Annonce à toutes les ligues</label>' : '') + '</div>';
  $('#main').innerHTML = h;
  S.chatKey = ''; S._chatFirst = true;
  document.querySelectorAll('[data-cl]').forEach(b => b.onclick = () => { S.chatLeague = b.dataset.cl; viewChat(); });
  const send = () => guard(async () => {
    const inp = $('#c_in'), text = inp.value.trim(); if (!text) return;
    const all = adm && $('#c_all') && $('#c_all').checked;
    inp.value = '';
    const box = $('#msgs');
    if (box) { const d = document.createElement('div'); d.className = 'msg mine'; d.style.opacity = '.55'; d.innerHTML = '<div class="mh"><b>' + esc(S.me.pseudo) + '</b> <span class="mute">envoi…</span></div><div class="mt">' + esc(text) + '</div>'; box.appendChild(d); box.scrollTop = box.scrollHeight; }
    try { await api('chatSend', { text: text, league: chatLeagueId() || undefined, all: all || undefined }); }
    catch (e) { inp.value = text; throw e; }
    S.chatKey = ''; S._chatFirst = true; await pollChat();
  });
  $('#c_go').onclick = send;
  $('#c_in').onkeydown = e => { if (e.key === 'Enter') send(); };
  pollChat();
}

/* Dates toujours en heure de Paris, quel que soit le fuseau du téléphone */
function parisParts(iso) {
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const o = {}; f.formatToParts(new Date(iso)).forEach(x => (o[x.type] = x.value));
  return { date: o.year + '-' + o.month + '-' + o.day, time: o.hour + ':' + o.minute };
}
function parisToISO(date, time) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date), t = /^(\d{2}):(\d{2})$/.exec(time);
  if (!m || !t) throw new Error('Date ou heure invalide.');
  const wall = Date.UTC(+m[1], +m[2] - 1, +m[3], +t[1], +t[2]);
  let guess = wall;
  for (let k = 0; k < 3; k++) {   // corrige du décalage Paris (été/hiver)
    const q = parisParts(new Date(guess).toISOString()), pm = /^(\d{4})-(\d{2})-(\d{2})$/.exec(q.date), pt = /^(\d{2}):(\d{2})$/.exec(q.time);
    guess += wall - Date.UTC(+pm[1], +pm[2] - 1, +pm[3], +pt[1], +pt[2]);
  }
  return new Date(guess).toISOString();
}

async function viewAdmin() {
  if (!S.adm) {
    $('#main').innerHTML = '<p class="mute" style="text-align:center;padding:40px">Chargement…</p>';
    await guard(async () => { S.adm = await api('adminGet'); S.board = S.board || await api('board'); });
    if (!S.adm) return;
  }
  const a = S.adm, st = a.settings, rk = (S.board && S.board.ranking) || {};
  let h = '<h2 style="margin-top:6px">Administration</h2>';
  h += '<div class="card"><h3>Réglages</h3>' +
    '<div class="field"><label>Verrouillage des pronos (heure de Paris)</label><div class="row2"><input id="s_ld" type="date" value="' + parisParts(st.lockISO).date + '"><input id="s_lt" type="time" value="' + parisParts(st.lockISO).time + '"></div><div class="mute" style="margin-top:4px">Actuellement : ' + esc(fmtDate(st.lockISO)) + '</div></div>' +
    '<div class="field"><label>URL de la source du classement live (optionnel)</label><input id="s_src" value="' + esc(st.sourceUrl) + '" placeholder="https://…"></div>' +
    '<div class="row sp field"><span>Mode manuel uniquement</span><input id="s_man" type="checkbox" style="width:auto" ' + (st.manualOnly ? 'checked' : '') + '></div>' +
    '<button class="btn" id="s_save">Enregistrer les réglages</button>' +
    '<button class="btn sec" id="s_ref" style="margin-top:8px">Rafraîchir le classement depuis la source</button></div>';

  if (a.requests && a.requests.length) {
    h += '<div class="card" style="background:var(--yellow)"><h3>🔑 Mots de passe oubliés (' + a.requests.length + ')</h3>';
    a.requests.forEach(r => {
      h += '<div class="u"><div><b>' + esc(r.pseudo) + '</b><div class="mute" style="color:var(--navy)">' + phoneHtml((a.users.find(x => x.pseudo === r.pseudo) || {}).phone) + ' · ' + esc(fmtTime(r.ts)) + '</div></div>' +
        '<div class="row"><button class="btn sm sec" data-rq="' + esc(r.pseudo) + '">Nouveau mot de passe</button><button class="btn sm danger" data-rd="' + esc(r.pseudo) + '">✖</button></div></div>';
    });
    h += '</div>';
  }
  h += '<div class="card"><h3>Ligues</h3><p class="mute">Un joueur est dans une seule ligue. Il la rejoint avec son code à l\'inscription.</p>';
  a.leagues.forEach(l => {
    h += '<div class="u"><div><b>' + esc(l.name) + '</b><div class="mute">Code : <b>' + esc(l.code) + '</b> · ' + l.count + ' joueur' + (l.count > 1 ? 's' : '') + '</div></div>' +
      '<div class="row"><button class="btn sm sec" data-le="' + esc(l.id) + '">Modifier</button><button class="btn sm danger" data-ld="' + esc(l.id) + '">✖</button></div></div>';
  });
  h += '<div class="field"><label>Nouvelle ligue</label><input id="n_name" placeholder="Nom (ex. Famille)" maxlength="30"></div>' +
    '<div class="field"><input id="n_code" placeholder="Code à donner (ex. FAMILLE26)" autocapitalize="characters" maxlength="20"></div>' +
    '<button class="btn" id="n_add">Créer la ligue</button></div>';

  h += '<div class="card"><h3>Classement officiel (saisie manuelle)</h3><p class="mute">Sert de secours ou pour corriger. Le déclencheur automatique écrase ces valeurs si le mode manuel est désactivé.</p>';
  S.cfg.classes.forEach(c => {
    h += '<div class="cl" style="margin-top:12px;color:var(--acc2);font-weight:800">' + esc(c.label) + '</div>';
    for (let i = 0; i < c.n; i++) {
      h += '<div class="field"><select data-rc="' + c.id + '" data-ri="' + i + '"><option value="">— place ' + (i + 1) + ' —</option>' +
        S.cfg.skippers[c.id].map(s => '<option value="' + esc(s.name) + '"' + ((rk[c.id] || [])[i] === s.name ? ' selected' : '') + '>' + esc(s.name) + ' · ' + esc(s.boat) + '</option>').join('') + '</select></div>';
    }
    h += '<label class="row"><input type="checkbox" data-fin="' + c.id + '" style="width:auto" ' + (a.finals[c.id] ? 'checked' : '') + '> Classement final de la classe</label>';
  });
  h += '<button class="btn" id="r_save" style="margin-top:12px">Publier le classement</button></div>';

  h += '<div class="card"><h3>Joueurs (' + a.users.length + ')</h3>';
  a.users.forEach(u => {
    h += '<div class="u"><div><b>' + esc(u.pseudo) + '</b> ' + (u.role === 'admin' ? '<span class="pill">admin</span>' : '') + '<div class="mute">' + phoneHtml(u.phone) + '</div>' + (u.role === 'admin' ? '' : '<select data-mv="' + esc(u.pseudo) + '" style="margin-top:6px;padding:6px">' + a.leagues.map(l => '<option value="' + esc(l.id) + '"' + (l.id === u.league ? ' selected' : '') + '>' + esc(l.name) + '</option>').join('') + '</select>') + '</div>' +
      (u.role === 'admin' ? '' : '<div class="row"><button class="btn sm sec" data-pin="' + esc(u.pseudo) + '">Reset mot de passe</button><button class="btn sm danger" data-del="' + esc(u.pseudo) + '">✖</button></div>') + '</div>';
  });
  h += '</div>';
  $('#main').innerHTML = h;

  $('#s_save').onclick = () => guard(async () => {
    const lockISO = parisToISO($('#s_ld').value, $('#s_lt').value);
    await api('adminSettings', { settings: {
      lockISO: lockISO, sourceUrl: $('#s_src').value, manualOnly: $('#s_man').checked
    } });
    S.cfg = await api('config'); S.adm = null; toast('Réglages enregistrés ✔'); viewAdmin();
  });
  $('#s_ref').onclick = () => guard(async () => {
    const r = await api('adminRefresh');
    S.board = await api('board');
    toast(r && r.skipped ? 'Source non active (mode manuel ou URL vide)' : r.changed ? 'Classement mis à jour ✔' : 'Aucun changement');
    S.adm = null; viewAdmin();
  });
  $('#r_save').onclick = () => guard(async () => {
    const ranking = {}, finals = {};
    S.cfg.classes.forEach(c => { ranking[c.id] = []; finals[c.id] = !!document.querySelector('[data-fin="' + c.id + '"]').checked; });
    document.querySelectorAll('[data-rc]').forEach(s => { if (s.value) ranking[s.dataset.rc].push(s.value); });
    const r = await api('adminSetRanking', { ranking: ranking, finals: finals });
    S.board = await api('board'); S.cfg = await api('config');
    toast(r.changed ? 'Classement publié ✔' : 'Aucun changement');
  });
  $('#n_add').onclick = () => guard(async () => {
    await api('adminLeagueSave', { name: $('#n_name').value, code: $('#n_code').value });
    S.adm = null; S.board = null; toast('Ligue créée ✔'); viewAdmin();
  });
  document.querySelectorAll('[data-le]').forEach(b => b.onclick = () => guard(async () => {
    const l = a.leagues.find(x => x.id === b.dataset.le);
    const v = await uiAsk({ title: 'Modifier la ligue', fields: [{ label: 'Nom de la ligue', value: l.name }, { label: 'Code d\'inscription', value: l.code }], ok: 'Enregistrer' });
    if (!v) return;
    await api('adminLeagueSave', { id: l.id, name: v[0], code: v[1] });
    S.adm = null; S.board = null; S.me = (await api('me')).me; toast('Ligue modifiée ✔'); viewAdmin();
  }));
  document.querySelectorAll('[data-ld]').forEach(b => b.onclick = () => guard(async () => {
    if (!(await uiConfirm('Supprimer cette ligue ?', '', 'Supprimer'))) return;
    await api('adminLeagueDelete', { id: b.dataset.ld }); S.adm = null; toast('Ligue supprimée'); viewAdmin();
  }));
  document.querySelectorAll('[data-mv]').forEach(sel => sel.onchange = () => guard(async () => {
    await api('adminMoveUser', { pseudo: sel.dataset.mv, league: sel.value });
    S.adm = null; S.board = null; toast('Joueur déplacé ✔'); viewAdmin();
  }));
  document.querySelectorAll('[data-rq]').forEach(b => b.onclick = () => guard(async () => {
    const v = await uiAsk({ title: 'Nouveau mot de passe pour ' + b.dataset.rq, text: '6 caractères minimum, sans espace. Envoie-le lui ensuite par SMS.', fields: [{ label: 'Mot de passe', type: 'text' }], ok: 'Définir' });
    if (!v || !v[0].trim()) return;
    await api('adminResetPin', { pseudo: b.dataset.rq, pin: v[0].trim() }); S.adm = null; toast('Mot de passe défini ✔'); viewAdmin();
  }));
  document.querySelectorAll('[data-rd]').forEach(b => b.onclick = () => guard(async () => {
    await api('adminDismissRequest', { pseudo: b.dataset.rd }); S.adm = null; viewAdmin();
  }));
  document.querySelectorAll('[data-pin]').forEach(b => b.onclick = () => guard(async () => {
    const v = await uiAsk({ title: 'Nouveau mot de passe pour ' + b.dataset.pin, text: '6 caractères minimum, sans espace.', fields: [{ label: 'Mot de passe', type: 'text' }], ok: 'Définir' });
    if (!v || !v[0].trim()) return;
    await api('adminResetPin', { pseudo: b.dataset.pin, pin: v[0].trim() }); toast('Mot de passe modifié ✔');
  }));
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => guard(async () => {
    if (!(await uiConfirm('Supprimer ' + b.dataset.del + ' ?', 'Son compte et ses pronos seront effacés.', 'Supprimer'))) return;
    await api('adminDeleteUser', { pseudo: b.dataset.del }); S.adm = null; S.board = null; toast('Joueur supprimé'); viewAdmin();
  }));
}

boot();
</script>
</body>
</html>
